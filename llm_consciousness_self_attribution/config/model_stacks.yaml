# Olmo 3 model stacks: single source of truth for the target-model lists that
# were previously copy-pasted (and commented in/out per run) across every
# script in prototyping_scripts/ and production_scripts/.
#
# Each stack is an ordered list of training stages. A stage has:
#   stage:  short label used in plots/results (e.g. "base", "sft", "dpo",
#           "instruct", "think").
#   model:  Hugging Face model id, exactly as passed to the inference provider.
#   chat_template_supported:
#           false for raw base models -- serving them naively raises vLLM
#           "default chat template not allowed" errors, so they must be run via
#           runners/local_app.py (or with an explicit template) rather than the
#           standard instruct path. true for SFT/DPO/instruct/think stages.
#
# Provider prefixing (e.g. "vllm/", "openrouter/") is applied by the runner, not
# stored here, so the same stack can be pointed at different providers.

schema_version: 1

# Default provider prefix the runners prepend to `model` ids. Olmo targets were
# served through vLLM on Modal for every May 25 run.
default_target_provider: vllm

# Extra get_model kwargs required for Olmo 3 tool use under vLLM/PETRI. The PETRI
# scripts all passed enable_auto_tool_choice=True and tool_call_parser="olmo3".
olmo_target_model_args:
  enable_auto_tool_choice: true
  tool_call_parser: olmo3

stacks:
  # The Olmo 3 7B Instruct stack is the prototype workhorse. The May 25 README
  # dashboard numbers come from the sft -> dpo -> instruct stages of this stack.
  olmo_7b_instruct_stack:
    - stage: base
      model: allenai/Olmo-3-1025-7B
      chat_template_supported: false
    - stage: sft
      model: allenai/Olmo-3-7B-Instruct-SFT
      chat_template_supported: true
    - stage: dpo
      model: allenai/Olmo-3-7B-Instruct-DPO
      chat_template_supported: true
    - stage: instruct
      model: allenai/Olmo-3-7B-Instruct
      chat_template_supported: true

  # 32B Instruct series. Note: the training flow diagram shows Instruct trained
  # off Think, but the actual Hugging Face model tree shows the 32B Instruct-SFT
  # tuned off allenai/Olmo-3-1125-32B, which is why base is the 1125-32B model.
  olmo_32b_instruct_series:
    - stage: base
      model: allenai/Olmo-3-1125-32B
      chat_template_supported: false
    - stage: sft
      model: allenai/Olmo-3.1-32B-Instruct-SFT
      chat_template_supported: true
    - stage: dpo
      model: allenai/Olmo-3.1-32B-Instruct-DPO
      chat_template_supported: true
    - stage: instruct
      model: allenai/Olmo-3.1-32B-Instruct
      chat_template_supported: true

  olmo_7b_think_stack:
    - stage: think
      model: allenai/olmo-3-7b-think
      chat_template_supported: true

  olmo_32b_think_stack:
    - stage: think
      model: allenai/olmo-3-32b-think
      chat_template_supported: true

# OpenRouter comparison targets kept around (previously commented out in
# OverlyComplicatedBergPaperStyleSelfMonitoringMay25.py) for later cross-model
# comparisons. These are already fully-qualified provider ids.
openrouter_comparison_models:
  - openrouter/allenai/olmo-3.1-32B-Instruct
  - openrouter/allenai/olmo-3-32b-think
  - openrouter/meta-llama/llama-3.2-1b-instruct
  - openrouter/meta-llama/llama-3.2-3b-instruct
  - openrouter/meta-llama/llama-3.1-8b-instruct
