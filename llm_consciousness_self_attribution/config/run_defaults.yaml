# Default run parameters: single source of truth for the judge/auditor model
# names and run knobs that were previously hardcoded (and commented in/out) in
# every eval script on the `main` branch.
#
# The May-25 runs standardized on these OpenAI grader models. The older
# OpenRouter / Anthropic grader choices appeared commented-out across the
# scripts and are retained here as documented alternatives.

schema_version: 1

grader_models:
  # PETRI-style runs split grading into an auditor (drives the conversation) and
  # a judge (scores the transcript). Berg-style static evals use only the judge.
  judge: openai/gpt-5.4-2026-03-05
  auditor: openai/gpt-5.4-mini-2026-03-17

  # Previously-used alternatives, retained for reference / A-B comparison.
  alternatives:
    judge:
      - openrouter/meta-llama/llama-3.1-405b-instruct
      - anthropic/claude-opus-4-6
    auditor:
      - openrouter/meta-llama/llama-3.3-70b-instruct
      - anthropic/claude-sonnet-4-6

run:
  # Sampling temperature for target/grader generation. The scripts relied on the
  # Inspect default; pinned here so runs are reproducible and configurable.
  temperature: 1.0
  # PETRI auditor/target conversation length. All May-25 PETRI runs used 10.
  turns: 10
  # RNG seed. The design rules require seeding RNGs; runs default to this unless
  # a caller overrides it.
  seed: 42

# Where eval logs live and how to mirror them locally. Single authoritative
# representation of the log-location convention (DRY): the Modal launcher writes
# here and the pull/view tooling reads from here, so the path is not duplicated
# across modal_app.py, the plot scripts, and the docs.
logs:
  # Modal Volume that persists the .eval logs (mounted read/write in the runner).
  volume: eval-logs
  # Path within the volume under which runs are written, laid out as
  #   <remote_root>/<method>/<stack>/<stage>/
  remote_root: refactor_runs
  # Local directory the pull tool mirrors the remote logs into. Relative to the
  # repo root, and git-ignored (the volume is the source of truth; the committed
  # historical fixtures live separately under eval-logs/may_25_logs/).
  local_dir: eval-logs/refactor_runs
